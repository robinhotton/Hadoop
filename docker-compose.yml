services:
  master:
    container_name: hadoop-master
    build:
      context: .
      dockerfile: Dockerfile.debian
    image: hadoop-cluster-base:latest
    hostname: hadoop-master
    ports:
      - "9870:9870"
      - "8088:8088"
      - "16010:16010"
      - "9000:9000"
      - "9090:9090"
      - "9091:9091"
    volumes:
      - hdfs-namenode:/data/hdfs/namenode
      - zookeeper-data:/data/zookeeper
      - ./src:/home/src
      - ./scripts/master/:/home/
    environment:
      - ROLE=master
    networks:
      hadoop-net:
        ipv4_address: 172.20.0.10
    mem_limit: 1.8g
    cpus: 1.5

  slave1:
    container_name: hadoop-slave1
    image: hadoop-cluster-base:latest
    hostname: hadoop-slave1
    ports:
      - "8041:8042"
    volumes:
      - hdfs-datanode-1:/data/hdfs/datanode
    environment:
      - ROLE=slave
    depends_on:
      master:
        condition: service_started
    networks:
      hadoop-net:
        ipv4_address: 172.20.0.20
    mem_limit: 0.8g
    cpus: 1

  slave2:
    container_name: hadoop-slave2
    image: hadoop-cluster-base:latest
    hostname: hadoop-slave2
    ports:
      - "8042:8042"
    volumes:
      - hdfs-datanode-2:/data/hdfs/datanode
    environment:
      - ROLE=slave
    depends_on:
      master:
        condition: service_started
    networks:
      hadoop-net:
        ipv4_address: 172.20.0.30
    mem_limit: 0.8g
    cpus: 1

volumes:
  hdfs-namenode:
  hdfs-datanode-1:
  hdfs-datanode-2:
  zookeeper-data:

networks:
  hadoop-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
